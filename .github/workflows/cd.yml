name: Resume
on:
  push:
    branches: [main]
jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: code clone
        uses: actions/checkout@v3
      - name: docker setup
        uses: docker/setup-buildx-action@v3
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: docker push
        run: |
          docker build -t brijesh408/resume:v${{github.run_number}} .
          docker push brijesh408/resume:v${{github.run_number}}

  deploy:
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: docker setup
        uses: docker/setup-buildx-action@v3
      - name: SSh & deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USERNAME}}
          key: ${{secrets.SERVER_KEY}}
          script: |
            sudo docker pull brijesh408/resume:v${{github.run_number}}
            sudo docker stop resume || true
            sudo docker rm resume || true
            sudo docker run -d --name resume -p 3001:80 brijesh408/resume:v${{github.run_number}} 
            sleep 5
            docker ps
